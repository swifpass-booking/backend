# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# The frontend is a static site built from the separate frontend repo; it proxies
# /v1 to the API and /agent to the voice concierge, so the browser stays same-origin (no CORS, no API URL baked in).
# If Render assigns different *.onrender.com hostnames than the names below,
# update the rewrites and the URL env vars to match.
databases:
  - name: swiftpass-db
    plan: free
    databaseName: swiftpass
    user: swiftpass

services:
  - type: web
    name: swiftpass-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: DATABASE_URL
        fromDatabase:
          name: swiftpass-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_BASE_URL
        value: https://swiftpass-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://swiftpass-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://swiftpass-api.onrender.com
      # Bootstraps the first admin on boot; set both in the dashboard.
      - key: ADMIN_IDENTIFIER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Payments stay in sandbox: eSewa's public test merchant; Khalti needs
      # a sandbox key from https://test-admin.khalti.com.
      - key: ESEWA_PRODUCT_CODE
        value: EPAYTEST
      - key: ESEWA_SECRET_KEY
        value: "8gBm/:&EnhH.1/q"
      - key: KHALTI_SECRET_KEY
        sync: false

  # Voice/text booking concierge (model repo). Groq serves both the LLM and
  # Whisper STT, so one GROQ_API_KEY (console.groq.com, free) is all it needs.
  - type: web
    name: swiftpass-agent
    runtime: python
    plan: free
    region: singapore
    repo: https://github.com/swifpass-booking/model
    branch: main
    rootDir: agent-project
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: SWIFTPASS_API_BASE_URL
        value: https://swiftpass-api.onrender.com/v1
      - key: SWIFTPASS_LLM_PROVIDER
        value: groq
      - key: SWIFTPASS_SPEECH_ENGINE
        value: groq
      - key: AGENT_CORS_ORIGINS
        value: https://swiftpass-web.onrender.com
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: swiftpass-web
    runtime: static
    repo: https://github.com/swifpass-booking/frontend
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /v1/*
        destination: https://swiftpass-api.onrender.com/v1/*
      - type: rewrite
        source: /agent/*
        destination: https://swiftpass-agent.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
